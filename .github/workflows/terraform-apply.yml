name: Terraform — Lambda + API Gateway

# workflow_dispatch permanently, by design — not a stopgap. Manual
# trigger avoids burning AWS Academy's limited budget/session time on
# every merge. The deploy itself is automatic end-to-end once
# triggered, with no manual steps during the run — only the trigger is
# manual, fired whenever convenient and the Lab session is active.
# Tested successfully end-to-end on 2026-09-15.
#
# Requires the four services (os, inventory, billing, execution) to already
# be deployed in the same AWS session: their load balancer hosts are looked up
# in the cluster by scripts/discover-service-hosts.sh, so there is nothing to
# copy by hand. For `destroy` the lookup is skipped (the services are usually
# gone by then).
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: lambda/auth/pom.xml

      - name: Build the Lambda jar
        run: mvn -B -f lambda/auth/pom.xml package -DskipTests

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Discover the services' load balancers
        env:
          ACTION: ${{ github.event.inputs.action }}
        run: |
          if [ "$ACTION" != "destroy" ]; then
            aws eks update-kubeconfig --region us-east-1 --name tech-challenge-eks
          fi
          echo "TF_VAR_service_hosts=$(bash scripts/discover-service-hosts.sh "$ACTION")" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan

      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve

      - name: Terraform destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
